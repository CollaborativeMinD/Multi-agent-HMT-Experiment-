name: Final Pro token semantics tracer
on:
  push:
    branches: [main]
    paths: [.github/workflows/pro-final-tracer.yml]
permissions:
  contents: write
concurrency:
  group: whiz-paid-baseline
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Offline tracer and regression gates
        run: |
          npm ci --ignore-scripts --prefix baseline
          python3 baseline/patch_engine.py
          python3 baseline/prepare_checkpoint.py
          node baseline/test_engine.mjs
          PYTHONPATH=scripts:baseline python3 -m unittest discover -s baseline -p test_runner.py -v
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p test_smoke.py -v
          PYTHONPATH=scripts:baseline:diagnostics python3 -m unittest discover -s diagnostics -p 'test_*.py' -v
          PYTHONPATH=scripts:baseline:diagnostics python3 -c "import probe; assert probe.checkpoint()['you']=='p4'"
          git config user.name "Whiz Evidence Runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Three isolated streaming probes
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 diagnostics/pro_final.py
      - name: Publish all findings
        if: always()
        run: |
          if [ -d evidence/pro-final-tracer ]; then
            git add evidence/pro-final-tracer
            git diff --cached --quiet || git commit -m "Publish router wire RCA results"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pro-final-tracer
          path: evidence/pro-final-tracer/
          if-no-files-found: warn
