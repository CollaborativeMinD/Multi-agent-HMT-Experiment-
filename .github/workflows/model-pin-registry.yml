name: Model Pin Registry Check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/model-pin-registry.yml]
permissions: {}
concurrency:
  group: model-pin-registry
  cancel-in-progress: false
jobs:
  verify-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check eight exact model IDs without inference
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          """Bounded metadata checks. Never generates tokens or logs response bodies."""
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          
          MODELS = {
              'openai': ['gpt-6-astra', 'gpt-6-sol'],
              'anthropic': ['claude-fable-5-1', 'claude-sonnet-5-5'],
              'gemini': ['gemini-3.8-flash', 'gemini-3.5-flash-lite'],
              'openrouter': ['qwen/qwen3.8-2.4t-a95b', 'qwen/qwen3.8-flash'],
          }
          HOSTS = {
              'openai': 'https://api.openai.com/v1/models/',
              'anthropic': 'https://api.anthropic.com/v1/models/',
              'gemini': 'https://generativelanguage.googleapis.com/v1beta/models/',
              'openrouter': 'https://openrouter.ai/api/v1/models/',
          }
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          
          def validate(provider, model, body):
              if not isinstance(body, dict):
                  raise ValueError('schema')
              data = body.get('data', {}) if provider == 'openrouter' else body
              field = 'name' if provider == 'gemini' else 'id'
              expected = 'models/' + model if provider == 'gemini' else model
              if data.get(field) != expected:
                  raise ValueError('identity')
              if provider == 'gemini' and 'generateContent' not in data.get('supportedGenerationMethods', []):
                  raise ValueError('generation method')
              if provider == 'openrouter':
                  endpoints = [e for e in data.get('endpoints', []) if e.get('tag') == 'alibaba']
                  if len(endpoints) != 1 or endpoints[0].get('status') != 0:
                      raise ValueError('route')
                  e = endpoints[0]
                  return {'returned_id': expected, 'route': 'alibaba',
                          'route_name': e['name'], 'quantization': e.get('quantization'),
                          'pricing': {k: e['pricing'].get(k) for k in ('prompt', 'completion')},
                          'supported_parameters': e.get('supported_parameters', [])}
              return {'returned_id': expected, 'version': data.get('version'),
                      'created': data.get('created', data.get('created_at'))}
          
          def probe(provider, model):
              row = {'provider': provider, 'model': model, 'status': 'FAIL', 'http_status': None}
              secret = os.environ.get(provider.upper() + '_API_KEY', '').strip()
              if not secret:
                  return dict(row, reason='MISSING_SECRET')
              headers = {'Accept': 'application/json'}
              if provider == 'anthropic':
                  headers.update({'x-api-key': secret, 'anthropic-version': '2023-06-01'})
              elif provider == 'gemini':
                  headers['x-goog-api-key'] = secret
              else:
                  headers['Authorization'] = 'Bearer ' + secret
              url = HOSTS[provider] + model + ('/endpoints' if provider == 'openrouter' else '')
              try:
                  req = urllib.request.Request(url, headers=headers, method='GET')
                  with urllib.request.build_opener(NoRedirect()).open(req, timeout=20) as response:
                      row['http_status'] = response.status
                      raw = response.read(1048577)
                  if len(raw) > 1048576:
                      raise ValueError('size')
                  row.update(validate(provider, model, json.loads(raw)))
                  row.update(status='PASS', reason='MODEL_METADATA_MATCH')
              except urllib.error.HTTPError as exc:
                  row.update(http_status=exc.code, reason='HTTP_ERROR')
              except (urllib.error.URLError, TimeoutError):
                  row['reason'] = 'NETWORK_OR_TIMEOUT'
              except (ValueError, TypeError, KeyError):
                  row['reason'] = 'METADATA_MISMATCH'
              except Exception:
                  row['reason'] = 'PROBE_INTERNAL_ERROR'
              return row
          
          def main():
              rows = [probe(p, m) for p, models in MODELS.items() for m in models]
              receipt = {'utc': datetime.now(timezone.utc).isoformat(),
                         'commit': os.environ.get('GITHUB_SHA', ''),
                         'scope': 'model_registry_only_no_inference',
                         'max_requests': 8, 'retries': 0, 'results': rows}
              print('MODEL_PIN_RECEIPT=' + json.dumps(receipt, sort_keys=True))
              lines = ['## Model registry pin verification', '', '| Model | Result | HTTP |', '|---|---|---|']
              lines += [f"| {r['model']} | {r['status']} | {r['http_status']} |" for r in rows]
              lines += ['', 'Eight metadata GETs maximum. No inference calls or raw response logs.',
                        'OpenRouter registry is public; this check does not prove account entitlement.',
                        'All selected models still require an inference smoke test before games.']
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
                  out.write('\n'.join(lines) + '\n')
              return int(any(r['status'] != 'PASS' for r in rows))
          
          if __name__ == '__main__':
              sys.exit(main())
          PYCODE
