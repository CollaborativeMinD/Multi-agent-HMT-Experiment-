name: Strict Whiz 240-second continuation
on:
  push:
    branches: [main]
    paths: [.github/workflows/whiz240-continuation.yml]
permissions:
  contents: read
concurrency:
  group: whiz-paid-baseline
  cancel-in-progress: false
jobs:
  baseline:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize reviewed checkpoint and rerun gates
        run: |
          python3 baseline/prepare_checkpoint.py
          npm ci --ignore-scripts --prefix baseline
          python3 baseline/patch_engine.py
          node baseline/test_engine.mjs
          PYTHONPATH=scripts:baseline python3 -m unittest discover -s baseline -p test_runner.py -v
          python3 baseline/analyze.py baseline/resume240
      - name: Resume at action 100 with 240-second deadline; stop on first issue
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 baseline/runner.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whiz240-evidence
          path: baseline/evidence/
          if-no-files-found: error
          retention-days: 30
