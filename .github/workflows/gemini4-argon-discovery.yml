name: Gemini 4 Argon metadata admission
on:
  push:
    branches: [main]
    paths: [.github/workflows/gemini4-argon-discovery.yml]
permissions:
  contents: write
concurrency:
  group: whiz-paid-baseline
  cancel-in-progress: false
jobs:
  discovery:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Offline regression gates
        run: |
          npm ci --ignore-scripts --prefix baseline
          python3 baseline/patch_engine.py
          python3 baseline/prepare_checkpoint.py
          node baseline/test_engine.mjs
          PYTHONPATH=scripts:baseline python3 -m unittest discover -s baseline -p test_runner.py -q
          PYTHONPATH=scripts python3 -m unittest discover -s tests -p test_smoke.py -q
          PYTHONPATH=scripts:baseline:series python3 -m unittest discover -s series -p test_series.py -q
          PYTHONPATH=scripts:baseline:series:trials python3 -m unittest discover -s trials -p 'test_*.py' -q
          PYTHONPATH=scripts:baseline:diagnostics python3 -m unittest discover -s diagnostics -p 'test_*.py' -q
          git config user.name "Whiz Evidence Runner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Authenticated Gemini 4 catalog discovery
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: PYTHONPATH=diagnostics python3 diagnostics/gemini4_discovery.py
      - name: Publish discovery evidence
        if: always()
        run: |
          if [ -d evidence/gemini4-argon-discovery ]; then
            git add evidence/gemini4-argon-discovery
            git diff --cached --quiet || git commit -m "Seal Gemini 4 Argon discovery evidence"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gemini4-argon-discovery
          path: evidence/gemini4-argon-discovery/
          if-no-files-found: warn
